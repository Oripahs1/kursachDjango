{% extends 'base.html' %}
{% load static %}

{% block head %}
    <title>Цены</title>
    <link rel="stylesheet" type="text/css" href="{% static 'order.css' %}">
{% endblock head %}

{% block content %}
    {% include 'messages.html' %}

    <div class="d-grid gap-2 col-6 mx-auto">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form_flex" style="padding-top: 20px">

                <div class="col-md-6 mb-3">
                    <label for="{{ form.place.id_for_label }}">{{ form.place.label }}</label>
                    {{ form.place }}
                </div>

                <div class="col-md-6 mb-3">
                    <label for="{{ form.price.id_for_label }}">{{ form.price.label }}</label>
                    {{ form.price }}
                </div>

            </div>
            <div class="bd-example bd-example-position-examples d-flex justify-content-around mb-3">
                <input type="submit" name="save" class="btn btn-outline-dark position-relative" value="Сохранить"/>
            </div>

        </form>
        <button type="button" class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#addCityModal">
            Добавить город
        </button>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="addCityModal" tabindex="-1" aria-labelledby="addCityModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addCityModalLabel">Добавить город</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="add-city-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="city-title" class="form-label">Название города</label>
                            <input type="text" class="form-control" id="city-title" name="title" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Добавить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
    $(document).ready(function() {
        $('#add-city-form').submit(function(event) {
            event.preventDefault();
            var title = $('#city-title').val();

            $.ajax({
                url: "{% url 'add_city' %}",
                method: 'POST',
                data: {
                    'title': title,
                    'csrfmiddlewaretoken': '{{ csrf_token }}'
                },
                success: function(data) {
                    if (data.success) {
                        location.reload(); // Перезагрузить страницу после успешного добавления города
                    } else {
                        alert('Ошибка при добавлении города');
                    }
                },
                error: function(xhr, status, error) {
                    console.log('Ошибка: ' + error.message);
                }
            });
        });
    });
</script>
{% endblock content %}
